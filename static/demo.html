<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM 답변 평가 리더보드 — 데모(목업)</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* demo-only banner */
    .demo-banner {
      max-width: 420px; margin: 0 auto 4px; color: #fff;
      font-size: 12px; text-align: center; opacity: .9;
    }
    .demo-note { font-size: 11px; color: var(--muted); margin: 2px 2px 0; }
  </style>
</head>
<body>
  <div class="demo-banner">데모 모드 — 화면 구성 미리보기용 목업 데이터입니다 (실제 채점 비활성화)</div>
  <div class="phone">
    <!-- Submission panel (레이아웃 확인용, 비활성) -->
    <section class="submit-panel">
      <h2>답변 제출</h2>
      <form id="submit-form">
        <input type="text" id="employee_id" placeholder="사번 (예: E1234)" value="E0258" />
        <input type="text" id="display_name" placeholder="이름 (선택)" value="Warren" />
        <label class="file-label has-file" id="file-label">
          <span id="file-name">sample_submission.csv</span>
          <input type="file" id="file" accept=".csv,text/csv" hidden />
        </label>
        <button type="submit" id="submit-btn">채점 제출</button>
      </form>
      <p class="demo-note">※ 점수는 디자인 확인용 예시값이며 실제 채점 결과가 아닙니다.</p>
      <div id="submit-result" class="submit-result" hidden></div>
    </section>

    <!-- Leaderboard -->
    <section class="board">
      <header class="board-header">
        <button class="back" aria-label="back">&#8249;</button>
        <h1>Leaderboard</h1>
      </header>

      <div id="podium" class="podium"></div>

      <div id="me-card" class="me-card">
        <div class="me-avatar" id="me-avatar"></div>
        <div class="me-name" id="me-name"></div>
        <div class="me-stats">
          <div><span class="lbl">Points:</span><span id="me-points"></span></div>
          <div><span class="lbl">Level:</span><span id="me-level"></span></div>
          <div><span class="lbl">Position:</span><span id="me-position"></span></div>
        </div>
      </div>

      <ul id="rank-list" class="rank-list"></ul>
    </section>
  </div>

  <script>
    "use strict";

    // ---- Mock data (레퍼런스 이미지 수치 그대로) ----
    const BOARD = [
      { rank: 1, display_name: "Albert Flores",   score: 2000 },
      { rank: 2, display_name: "Bessie Cooper",   score: 1987 },
      { rank: 3, display_name: "Devon Lane",      score: 1982 },
      { rank: 4, display_name: "Esther Howard",   score: 1087 },
      { rank: 5, display_name: "Leslie Alexander", score: 1055 },
      { rank: 6, display_name: "Kristin Watson",  score: 1002 },
      { rank: 7, display_name: "Albert Flores",   score: 917 },
    ];
    const ME = { display_name: "Warren", points: 238, level: "Silver 🥈", position: 258 };

    const $ = (id) => document.getElementById(id);
    const escapeHtml = (s) => (s || "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    function initials(name) {
      const p = (name || "").trim().split(/\s+/);
      return (p.length >= 2 ? p[0][0] + p[1][0] : (name || "?").slice(0, 2)).toUpperCase();
    }

    function renderPodium() {
      const podium = $("podium");
      const order = [BOARD[1], BOARD[0], BOARD[2]];   // 2위, 1위, 3위
      const rankClass = ["rank2", "rank1", "rank3"];
      const barNum = ["2", "1", "3"];
      podium.innerHTML = "";
      order.forEach((entry, i) => {
        const slot = document.createElement("div");
        slot.className = "slot " + rankClass[i];
        slot.innerHTML = `
          <div class="avatar">${initials(entry.display_name)}</div>
          <div class="p-name">${escapeHtml(entry.display_name)}</div>
          <div class="p-points">${entry.score} points</div>
          <div class="bar">${barNum[i]}</div>`;
        podium.appendChild(slot);
      });
    }

    function renderMeCard() {
      $("me-avatar").textContent = initials(ME.display_name);
      $("me-points").textContent = ME.points;
      $("me-level").textContent = ME.level;
      $("me-position").textContent = ME.position;
    }

    function renderList() {
      const list = $("rank-list");
      list.innerHTML = "";
      BOARD.slice(3).forEach((entry) => {
        const li = document.createElement("li");
        const crownColor = entry.rank === 7 ? "color:var(--crown-gold)" : "color:var(--crown-pink)";
        li.innerHTML = `
          <span class="num">${String(entry.rank).padStart(2, "0")}</span>
          <div class="info">
            <div class="nm">${escapeHtml(entry.display_name)}</div>
            <div class="pts">${entry.score} points</div>
          </div>
          <span class="crown" style="${crownColor}">👑</span>`;
        list.appendChild(li);
      });
    }

    // 데모: 제출은 비활성화
    $("submit-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const box = $("submit-result");
      box.className = "submit-result ok";
      box.textContent = "데모 모드입니다 — 실제 채점은 비활성화되어 있습니다.";
      box.hidden = false;
    });

    renderPodium();
    renderMeCard();
    renderList();
  </script>
</body>
</html>
